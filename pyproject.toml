[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "organize-folder-by-filetype"
version = "1.9.0"
description = "Collision-safe folder organizer by file type"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
ocr = ["pytesseract", "Pillow", "openpyxl"]
watch = ["watchdog>=3.0"]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]

[tool.setuptools]
packages = []
